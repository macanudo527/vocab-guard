[project]
name = "vocab-guard-checker"
version = "0.1.0"
description = "Checks text against level word and kanji lists."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
    # 0.7.x is an unstable pre-1.0 series with a new dictionary format.
    # 20260723 is the last sudachidict-core release that supports 0.6.x.
    "sudachipy==0.6.11",
    "sudachidict-core==20260723",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
