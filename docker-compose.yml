# vocab-guard: the checker API and n8n.
#   docker compose up                    # checker on :8000, n8n on :5678
#   docker compose --profile demo up     # also WordPress on :8080 (with MariaDB)
# Ports can be changed in .env (CHECKER_PORT, N8N_PORT, WORDPRESS_PORT).
# Copy .env.example to .env first.

name: vocab-guard

x-wordpress-db: &wordpress-db
  WORDPRESS_DB_HOST: mariadb
  WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
  WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
  WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-}
  # Application passwords (used by n8n) need HTTPS unless the site is "local".
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');

services:
  checker:
    build:
      context: .
      dockerfile: checker/Dockerfile
    image: vocab-guard-checker:local
    ports:
      - "${CHECKER_PORT:-8000}:8000"
    environment:
      CHECKER_API_KEY: ${CHECKER_API_KEY:-}
    # To add your own lists, mount them under /app/lists/data:
    # volumes:
    #   - ./lists/data:/app/lists/data:ro
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.44.6
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      checker:
        condition: service_healthy
    restart: unless-stopped

  mariadb:
    profiles: [demo]
    image: mariadb:12.3.3
    # Empty passwords make MariaDB refuse to start; set them in .env.
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  wordpress:
    profiles: [demo]
    image: wordpress:7.1.3-php8.4-apache
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      <<: *wordpress-db
    volumes:
      - wp_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: installs WordPress, turns on pretty permalinks (needed for
  # /wp-json/), and creates an application password for n8n on first run.
  wordpress-setup:
    profiles: [demo]
    image: wordpress:cli-2.12.0-php8.4
    user: "33:33" # www-data in the wordpress image, so file ownership matches
    environment:
      <<: *wordpress-db
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      WP_URL: http://localhost:${WORDPRESS_PORT:-8080}
    volumes:
      - wp_data:/var/www/html
    depends_on:
      wordpress:
        condition: service_started
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        : "$${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD in .env}"
        : "$${WP_ADMIN_PASSWORD:?set WP_ADMIN_PASSWORD in .env}"
        until [ -f wp-config.php ] && wp db check --quiet >/dev/null 2>&1; do sleep 2; done
        if ! wp core is-installed 2>/dev/null; then
          wp core install --url="$$WP_URL" --title="vocab-guard demo" \
            --admin_user="$$WP_ADMIN_USER" --admin_password="$$WP_ADMIN_PASSWORD" \
            --admin_email="$$WP_ADMIN_EMAIL" --skip-email
          wp rewrite structure '/%postname%/'
        fi
        if [ -z "$$(wp user application-password list "$$WP_ADMIN_USER" --name=n8n --field=uuid)" ]; then
          echo "WordPress application password for n8n (user $$WP_ADMIN_USER):"
          wp user application-password create "$$WP_ADMIN_USER" n8n --porcelain
        else
          echo "An application password named n8n already exists. Revoke it in wp-admin > Users > Profile to make a new one."
        fi
    restart: "no"

volumes:
  n8n_data:
  db_data:
  wp_data:
